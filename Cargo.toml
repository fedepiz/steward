[package]
name = "steward"
version = "0.1.0"
edition = "2024"

[profile.dev]
opt-level = 2

[workspace]
members = ["crates/*"]

[workspace.dependencies]
macroquad = { version = "0.4.4" }
num_enum = { version = "*" }
pathfinding = { version = "*" }
strum = { version = "*", features = ["derive"] }
rayon = { version = "*" }

tracing = "*"
tracing-subscriber = "*"
tracing-tracy = { version = "*", default-features = false }
# tracing-tracy = { version = "*" }

csv = { path = "crates/csv"}
gui = { path = "crates/gui" }
util = { path = "crates/util" }

[dependencies]
macroquad = { workspace = true }
num_enum = { workspace = true }
pathfinding = { workspace = true }
strum = { workspace = true }
rayon = { workspace = true }


tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-tracy = { workspace = true }

csv = { workspace = true }
gui = { workspace = true }
util = { workspace = true }
